<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="description" content="ไม่พบหน้าที่ต้องการในเว็บไซต์เรียนรู้ยุทธศาสตร์การศึกษาอยุธยา"><title>ไม่พบหน้า | อยุธยา เรียนรู้การวางยุทธศาสตร์</title><style>body{font:18px/1.9 Tahoma,sans-serif;color:#102c46;background:#f1f5fa;margin:0;padding:40px 22px}main{max-width:720px;margin:10vh auto;background:white;border:1px solid #dbe3eb;border-radius:20px;padding:clamp(24px,5vw,50px)}h1{font-size:2rem;line-height:1.5}a{color:#164fa3;text-underline-offset:5px}a:focus-visible{outline:3px solid #b37409;outline-offset:4px}p{overflow-wrap:anywhere}.code{color:#164fa3;font-size:1rem;font-weight:bold}li{padding:6px 0}</style><link rel="stylesheet" href="assets/workshop.css"></head><body><main id="main"><p class="code">404 / อยุธยา · เรียนรู้การวางยุทธศาสตร์</p><h1>ไม่พบหน้าที่ต้องการ</h1><p>ลิงก์อาจเปลี่ยนไปแล้ว ลองเปิดหน้าแรกตามระดับโฟลเดอร์ด้านล่าง หรือแจ้งลิงก์ที่มีปัญหาให้ผู้จัดทำ</p><ul id="return-links"><li><a href="index.html">หน้าแรกในโฟลเดอร์นี้</a></li></ul><p><a href="mailto:burapatis@gmail.com">burapatis@gmail.com</a><br>บูรพาทิศ พลอยสุวรรณ์ ผู้วิจัยอิสระ</p><noscript><p>หากลิงก์หน้าแรกยังเปิดไม่ได้ ให้ลบส่วนท้ายของ URL จนถึงชื่อคลัง GitHub ของเว็บไซต์ แล้วเปิด index.html</p></noscript></main><script>'use strict';(function(){if(location.protocol==='file:')return;const list=document.getElementById('return-links');list.replaceChildren();const parts=location.pathname.split('/').filter(Boolean);parts.pop();const bases=[];while(parts.length){bases.push('/'+parts.join('/')+'/');parts.pop();}bases.push('/');bases.forEach(base=>{const li=document.createElement('li'),a=document.createElement('a');a.href=base+'index.html';a.textContent='เปิดหน้าแรกที่ '+base;li.append(a);list.append(li);});})();</script></body></html>
